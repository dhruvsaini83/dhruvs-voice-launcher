<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body {
    width: 290px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #eee;
    padding: 18px;
    margin: 0;
    user-select: none;
  }
  h2 {
    font-size: 17px;
    margin: 0 0 6px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
  }
  p { font-size: 12px; color: #8e95a5; margin: 0 0 14px; line-height: 1.4; }
  .mic-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 15px 0 10px;
  }
  .mic-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: white;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    outline: none;
  }
  .mic-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
  }
  .mic-btn.active {
    background: linear-gradient(135deg, #dc2626, #ef4444);
    box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
    70% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }
  #status {
    font-size: 13px;
    font-weight: 500;
    color: #38bdf8;
    text-align: center;
    min-height: 20px;
    margin-top: 8px;
    word-break: break-word;
  }
  .heard-box {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    color: #e2e8f0;
    text-align: center;
    margin-top: 10px;
    display: none;
  }
  .mapping {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 14px;
    line-height: 1.6;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 8px;
    padding: 10px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .mapping strong { color: #f8fafc; }
  .tag {
    background: rgba(56, 189, 248, 0.15);
    color: #38bdf8;
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 10px;
  }
  .web-launcher-link {
    display: block;
    margin-top: 12px;
    text-align: center;
    color: #60a5fa;
    font-size: 11px;
    text-decoration: none;
  }
  .web-launcher-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h2>🎙️ Dhruv's Voice Launcher <span class="tag">Mobile/Web</span></h2>
  <p id="hint">Tap the mic button and speak your command hands-free.</p>

  <div class="mic-container">
    <button id="micToggleBtn" class="mic-btn" title="Tap to Speak">🎤</button>
  </div>

  <div id="status">Status: tap mic to speak</div>
  <div id="heardBox" class="heard-box"></div>

  <div class="mapping">
    <strong>"Open"</strong> + site: "Open YouTube", "Open Amazon"<br>
    <strong>"Close"</strong>: Closes current or specified tab
  </div>

  <a href="samsung_launcher.html" target="_blank" class="web-launcher-link">🌐 Open Fullscreen Samsung Web Launcher</a>

  <script src="popup.js"></script>
</body>
</html>
